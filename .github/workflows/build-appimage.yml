name: Build Release Packages (Ubuntu 22.04 LTS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg binutils file curl ca-certificates \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run PyInstaller
        run: |
          pyinstaller --noconfirm Bemudex.spec

      - name: Build AppImage
        run: |
          bash packaging/linux/build_appimage.sh

      - name: Build Debian Package
        run: |
          bash packaging/linux/build_deb.sh --skip-build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bemudex-Linux-Packages
          path: |
            dist/Bemudex-x86_64.AppImage
            dist/*.deb

      - name: Release Packages to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Bemudex-x86_64.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
